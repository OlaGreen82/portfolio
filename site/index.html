<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Senior Instructional Designer</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#A6D4C9">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <div class="container header-inner">
      <a class="logo" href="#top" data-t="name"></a>

      <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only" data-t="menu"></span>
        <span class="menu-bar"></span><span class="menu-bar"></span><span class="menu-bar"></span>
      </button>

      <nav class="site-nav" id="site-nav">
        <a href="#projects" data-t="nav.projects"></a>
        <a href="#about" data-t="nav.about"></a>
        <a href="#experience" data-t="nav.experience"></a>
        <a href="#contact" data-t="nav.contact"></a>
        <button class="lang-toggle" type="button" data-t="langToggle"></button>
        <a class="btn btn-primary btn-sm js-whatsapp" target="_blank" rel="noopener" data-t="nav.talk"></a>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- Hero -->
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-text reveal">
          <p class="eyebrow" data-t="hero.eyebrow"></p>
          <h1 data-t="hero.title"></h1>
          <p class="lead" data-t="hero.subtitle"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#projects" data-t="hero.ctaPrimary"></a>
            <a class="btn btn-ghost" href="#contact" data-t="hero.ctaSecondary"></a>
          </div>
        </div>
        <div class="hero-visual reveal">
          <div class="portrait-blob"></div>
          <img class="portrait js-portrait" alt="" width="420" height="480">
        </div>
      </div>
    </section>

    <!-- Clients -->
    <section class="clients" aria-labelledby="clients-title">
      <div class="container">
        <h2 class="clients-title" id="clients-title" data-t="clientsTitle"></h2>
      </div>
      <div class="marquee">
        <div class="marquee-track js-clients"></div>
      </div>
    </section>

    <!-- Stats -->
    <section class="stats">
      <div class="container stats-grid js-stats"></div>
    </section>

    <!-- Projects -->
    <section class="section" id="projects">
      <div class="container">
        <div class="section-head reveal">
          <h2 data-t="projects.title"></h2>
          <p data-t="projects.subtitle"></p>
        </div>
        <div class="filters js-filters" role="group"></div>
        <div class="projects-grid js-projects"></div>
      </div>
    </section>

    <!-- About -->
    <section class="section section-tint" id="about">
      <div class="container about-grid">
        <div class="reveal">
          <h2 data-t="about.title"></h2>
          <div class="about-text js-about"></div>
          <a class="btn btn-ghost js-cv" download data-t="about.cv"></a>
        </div>
        <blockquote class="pullquote reveal">
          <p data-t="about.quote"></p>
        </blockquote>
      </div>
    </section>

    <!-- Experience -->
    <section class="section" id="experience">
      <div class="container">
        <div class="section-head reveal">
          <h2 data-t="experience.title"></h2>
        </div>
        <ol class="timeline js-experience"></ol>
      </div>
    </section>

    <!-- Contact -->
    <section class="section contact" id="contact">
      <div class="container contact-inner reveal">
        <h2 data-t="contact.title"></h2>
        <p class="lead" data-t="contact.text"></p>
        <div class="contact-links">
          <a class="contact-card js-whatsapp" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
            <span data-t="contact.whatsapp"></span>
          </a>
          <a class="contact-card js-email">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.2 7 12 11.5 18.8 7H5.2z"/></svg>
            <span data-t="contact.email"></span>
          </a>
          <a class="contact-card js-linkedin" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3v-11zm6.5 0h3.8v1.5h.1a4.2 4.2 0 0 1 3.8-2c4 0 4.8 2.6 4.8 6.1v5.4h-4v-4.8c0-1.2 0-2.7-1.6-2.7s-1.9 1.3-1.9 2.6v4.9h-4v-11z"/></svg>
            <span data-t="contact.linkedin"></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span class="js-year"></span> <span data-t="name"></span>. <span data-t="footer.rights"></span></p>
      <div class="footer-links">
        <a class="js-linkedin" target="_blank" rel="noopener">LinkedIn</a>
        <a class="js-email">Email</a>
        <a class="js-whatsapp" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
